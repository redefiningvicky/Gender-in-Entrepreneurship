name: Export presentation PDF pages as high-resolution PNGs

on:
  push:
    paths:
      - 'Presentation/*.pdf'
      - '.github/workflows/export-presentation-png.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-png:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Convert PDF pages to 300 DPI PNG
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          for pdf in Presentation/*.pdf; do
            base="${pdf%.pdf}"
            rm -f "${base}"_page-*.png
            pdftoppm -r 300 -png "${pdf}" "${base}_page" 
          done
      - name: Commit rendered PNG pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'Presentation/*.png'
          if ! git diff --cached --quiet; then
            git commit -m "Add 300 DPI PNGs for presentation PDF pages"
            git push
          fi
